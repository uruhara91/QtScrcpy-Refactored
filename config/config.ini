[common]
# UI language: Auto, zh_CN, en_US, ja_JP
Language=en_US

# Main window title
WindowTitle=QtS

# Destination directory for pushed files. Keep the trailing slash.
PushFilePath=/sdcard/

# Maximum capture rate. Use 0 for no explicit limit.
MaxFps=60

# Legacy compatibility option. The experimental renderer already keeps only
# the newest ready frame, so this setting no longer changes frame pacing.
RenderExpiredFrames=0

# Legacy compatibility option: -1 auto, 0 software, 1 DirectX, 2 OpenGL.
# The experimental renderer currently uses its event-driven OpenGL path.
UseDesktopOpenGL=2

# Remote scrcpy-server location.
ServerPath=/data/local/tmp/scrcpy-server.jar

# Optional adb executable. Empty uses the platform default.
AdbPath=

# Realtime MediaCodec options for Android 11 and newer.
CodecOptions="priority=0,latency=1"
# If the encoder rejects latency, use CodecOptions="priority=0".

# Exact H.264 encoder component. Empty selects automatically.
# Example: CodecName="OMX.MTK.VIDEO.ENCODER.AVC"
CodecName=""

# verbose, debug, info, warn, error
LogLevel=error
