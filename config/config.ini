[common]
Language=en_US
WindowTitle=QtS
PushFilePath=/sdcard/
MaxFps=60

# Legacy compatibility; the experimental renderer already keeps the newest frame.
RenderExpiredFrames=0
# Legacy compatibility; the experimental renderer uses event-driven OpenGL.
UseDesktopOpenGL=2

ServerPath=/data/local/tmp/scrcpy-server.jar
AdbPath=

# Realtime MediaCodec options for Android 11+.
CodecOptions="priority=0,latency=1"
# Fallback for encoders that reject latency: CodecOptions="priority=0"

# Empty selects the H.264 encoder automatically.
# MediaTek example: CodecName="OMX.MTK.VIDEO.ENCODER.AVC"
CodecName=""

# Shared client/server levels: debug, info, warn, error
LogLevel=error
