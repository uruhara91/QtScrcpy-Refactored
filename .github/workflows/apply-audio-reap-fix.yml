name: Apply audio process reap fix
on:
  push:
    branches: [experimental]
    paths: [.github/workflows/apply-audio-reap-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - run: python3 .github/scripts/fix_audio_process_reap.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add QtScrcpy/audio/audiooutput.cpp
          git commit -m 'fix(audio): fully reap adb helpers before destruction'
          git push origin HEAD:experimental
