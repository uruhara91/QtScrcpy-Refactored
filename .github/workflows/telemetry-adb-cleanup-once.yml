name: Consolidate telemetry and harden adb results
on:
  push:
    branches: [experimental]
    paths: [.github/workflows/telemetry-adb-cleanup-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_name}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          decoder = 'QtScrcpy/QtScrcpyCore/src/device/decoder/decoder.cpp'
          replace_once(decoder,
              '#include "compat.h"\n',
              '#include "compat.h"\n#include "qtscrcpytelemetry.h"\n')
          replace_once(decoder,
              '    m_telemetryEnabled = qEnvironmentVariableIntValue("QTSCRCPY_TELEMETRY") > 0;\n',
              '    m_telemetryEnabled = qsc::telemetry::enabled();\n')

          renderer = 'QtScrcpy/render/qyuvopenglwidget.cpp'
          replace_once(renderer,
              '#include "qyuvopenglwidget.h"\n',
              '#include "qyuvopenglwidget.h"\n#include "qtscrcpytelemetry.h"\n')
          replace_once(renderer,
              '    m_telemetryEnabled = qEnvironmentVariableIntValue("QTSCRCPY_TELEMETRY") > 0;\n',
              '    m_telemetryEnabled = qsc::telemetry::enabled();\n')

          audio = Path('QtScrcpy/audio/audiooutput.cpp')
          text = audio.read_text(encoding='utf-8-sig')
          if '#include "qtscrcpytelemetry.h"\n' not in text:
              text = text.replace('#include "audiooutput.h"\n',
                                  '#include "audiooutput.h"\n#include "qtscrcpytelemetry.h"\n', 1)
          helper = '''[[nodiscard]] int boundedEnvironmentValue(const char *name,
                                          int fallback,
                                          int minimum,
                                          int maximum)
{
    bool ok = false;
    const int value = qEnvironmentVariableIntValue(name, &ok);
    return ok ? qBound(minimum, value, maximum) : fallback;
}

[[nodiscard]] bool environmentEnabled(const char *name, bool fallback)
{
    if (!qEnvironmentVariableIsSet(name)) return fallback;
    return qEnvironmentVariableIntValue(name) != 0;
}

'''
          if text.count(helper) != 1:
              raise SystemExit('audiooutput.cpp: environment helper block mismatch')
          text = text.replace(helper, '', 1)
          text = text.replace('boundedEnvironmentValue(',
                              'qsc::telemetry::boundedEnvironmentInt(')
          text = text.replace('environmentEnabled(',
                              'qsc::telemetry::environmentFlag(')
          audio.write_text(text, encoding='utf-8')

          adb = Path('QtScrcpy/QtScrcpyCore/src/adb/adbprocessimpl.cpp')
          text = adb.read_text(encoding='utf-8-sig')
          if '#include <QSet>\n' not in text:
              text = text.replace('#include <QProcess>\n', '#include <QProcess>\n#include <QSet>\n', 1)
          text = text.replace('qsc::telemetryEnabled()', 'qsc::telemetry::enabled()')
          text = text.replace('qsc::telemetryThreadId()', 'qsc::telemetry::threadId()')

          old_execute = '''void AdbProcessImpl::execute(const QString &serial, const QStringList &args)
{
    QStringList normalizedArgs = args;
'''
          new_execute = '''void AdbProcessImpl::execute(const QString &serial, const QStringList &args)
{
    // Each command owns its output. Keeping data from previous executions made
    // repeated `adb devices` scans return duplicate serials and stale errors.
    m_standardOutput.clear();
    m_errorOutput.clear();

    QStringList normalizedArgs = args;
'''
          if text.count(old_execute) != 1:
              raise SystemExit('adbprocessimpl.cpp: execute block mismatch')
          text = text.replace(old_execute, new_execute, 1)

          old_devices = '''    QStringList devicesInfoList = m_standardOutput.split(lineExp);
    for (QString deviceInfo : devicesInfoList) {
        QStringList deviceInfos = deviceInfo.split(tExp);
        if (2 == deviceInfos.count() && 0 == deviceInfos[1].compare("device")) {
            serials << deviceInfos[0];
        }
    }
    return serials;
'''
          new_devices = '''    QSet<QString> seen;
    const QStringList devicesInfoList = m_standardOutput.split(lineExp);
    for (const QString &deviceInfo : devicesInfoList) {
        const QStringList deviceInfos = deviceInfo.split(tExp);
        if (deviceInfos.count() != 2 || deviceInfos[1] != QStringLiteral("device")) {
            continue;
        }

        const QString serial = deviceInfos[0].trimmed();
        if (serial.isEmpty() || seen.contains(serial)) continue;
        seen.insert(serial);
        serials << serial;
    }
    return serials;
'''
          if text.count(old_devices) != 1:
              raise SystemExit('adbprocessimpl.cpp: device parser block mismatch')
          adb.write_text(text.replace(old_devices, new_devices, 1), encoding='utf-8')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add QtScrcpy/QtScrcpyCore/src/device/decoder/decoder.cpp QtScrcpy/render/qyuvopenglwidget.cpp QtScrcpy/audio/audiooutput.cpp QtScrcpy/QtScrcpyCore/src/adb/adbprocessimpl.cpp
          git commit -m 'refactor(telemetry): centralize gates and isolate adb command output'
          git push origin HEAD:experimental
