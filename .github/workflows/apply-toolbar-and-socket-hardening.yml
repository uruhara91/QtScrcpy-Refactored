name: Apply toolbar and socket hardening

on:
  push:
    branches:
      - experimental
    paths:
      - .github/workflows/apply-toolbar-and-socket-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
          fetch-depth: 0

      - name: Apply deterministic source changes
        run: python3 .github/scripts/apply_toolbar_and_socket_hardening.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/apply_toolbar_and_socket_hardening.py
          git rm .github/workflows/apply-toolbar-and-socket-hardening.yml
          git add QtScrcpy
          git commit -m "Fix toolbar dragging and harden socket handshake"
          git push origin HEAD:experimental
