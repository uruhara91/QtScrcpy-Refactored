[common]
# UI language: Auto, zh_CN, en_US
Language=en_US

# Main window title
WindowTitle=QtS

# Destination directory for pushed files. Keep the trailing slash.
PushFilePath=/sdcard/

# Maximum capture rate. Use 0 for no explicit limit.
MaxFps=60

# Legacy compatibility; the experimental renderer already keeps the newest frame.
RenderExpiredFrames=0

# Legacy compatibility; the experimental renderer uses event-driven OpenGL.
UseDesktopOpenGL=2

# Remote scrcpy-server location.
ServerPath=/data/local/tmp/scrcpy-server.jar

# Optional adb executable. Empty uses the platform default.
AdbPath=

# Realtime MediaCodec options for Android 11 and newer.
CodecOptions="priority=0,latency=1"

# Empty selects the H.264 encoder automatically.
# CodecName="OMX.MTK.VIDEO.ENCODER.AVC"
CodecName=""

# verbose, debug, info, warn, error
LogLevel=error
