name: Finish adb ownership hardening
on:
  push:
    branches: [experimental]
    paths: [.github/workflows/finish-adb-ownership.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - run: python3 .github/scripts/finish_adb_ownership.py
      - run: |
          rm -f \
            .github/scripts/finish_adb_ownership.py \
            .github/workflows/finish-adb-ownership.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m 'hardening(adb): parent remaining helper processes'
          git push origin HEAD:experimental
