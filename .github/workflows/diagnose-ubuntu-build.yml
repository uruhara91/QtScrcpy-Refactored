name: Diagnose Ubuntu build

on:
  push:
    branches:
      - fix/realtime-input-and-codec-options
    paths:
      - .github/workflows/diagnose-ubuntu-build.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
      options: --privileged
    env:
      DEBIAN_FRONTEND: noninteractive
      qt-install-path: ${{ github.workspace }}/Qt/5.15.2
    steps:
      - run: |
          apt-get update
          apt-get install -y git ca-certificates sudo build-essential cmake libglew-dev libglfw3-dev imagemagick wget patchelf zip libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libfontconfig1-dev libfreetype6-dev libxrender-dev libxext-dev gnupg lsb-release python3 python3-pip fuse libasound2-dev software-properties-common
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive
      - uses: jurplel/install-qt-action@v4.1.1
        with:
          version: 5.15.2
          setup-python: false
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          python3 ci/generate-version.py
          ci/linux/build_for_linux.sh Release > build-full.log 2>&1
          status=$?
          mkdir -p diagnostics
          {
            echo "exit_status=$status"
            echo "===== compiler diagnostics ====="
            grep -n -E "(^|[ :])(error:|fatal error:|undefined reference|C[0-9]{4}:|FAILED:|ninja:|make(\[[0-9]+\])?: \*\*\*)" build-full.log | tail -n 300
            echo "===== build tail ====="
            tail -n 300 build-full.log
          } > diagnostics/ubuntu-build.txt
          exit 0
      - name: Commit diagnostic and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-ubuntu-build.yml
          git add diagnostics/ubuntu-build.txt
          git commit -m "Capture Ubuntu compiler diagnostics"
          git push origin HEAD:${{ github.ref_name }}
