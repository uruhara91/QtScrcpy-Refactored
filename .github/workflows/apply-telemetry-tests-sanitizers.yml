name: Apply telemetry tests and sanitizers
on:
  push:
    branches: [experimental]
    paths: [.github/workflows/apply-telemetry-tests-sanitizers.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experimental
      - run: python3 .github/scripts/apply_telemetry_tests_sanitizers.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add QtScrcpy/QtScrcpyCore/src/device/decoder/decoder.cpp QtScrcpy/render/qyuvopenglwidget.cpp QtScrcpy/CMakeLists.txt
          git commit -m 'test(build): add sanitizers and consolidate telemetry'
          git push origin HEAD:experimental
